<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MONKEY BAR Sports Ticker</title>
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Oswald:wght@500;700&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        :root {
            --primary-glow: #00f0ff;
            --secondary-glow: #ff0055;
            --accent-gold: #ffea00;
            --bg-dark: #010308;
            --card-bg: rgba(4, 10, 20, 0.94);
            --team-primary: #00f0ff;
            --team-secondary: #ff0055;
            --stadium-glow: rgba(0, 240, 255, 0.2);
            --redzone-red: #ff0044;
            --winning-color-1: #00f0ff;
            --winning-color-2: #ff0055;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: var(--bg-dark);
            color: #ffffff;
            font-family: 'Roboto Condensed', sans-serif;
            cursor: none;
        }

        #cyberCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%);
            background-size: 100% 4px;
            z-index: 2;
            opacity: 0.3;
        }

        body.rotated-90 {
            width: 100vh !important;
            height: 100vw !important;
            transform: rotate(90deg);
            transform-origin: center center;
            position: absolute;
            top: calc(50% - 50vw);
            left: calc(50% - 50vh);
        }

        .tv-frame {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: radial-gradient(circle at 50% 20%, var(--stadium-glow) 0%, rgba(1, 3, 8, 0.98) 85%);
            position: relative;
            box-shadow: inset 0 0 120px rgba(0, 0, 0, 0.95);
            transition: background 1.2s ease-in-out;
            z-index: 3;
            overflow: hidden;
        }

        .stadium-flare {
            position: absolute;
            top: -15%;
            left: 50%;
            transform: translateX(-50%);
            width: 160%;
            height: 50vh;
            background: radial-gradient(ellipse at top, var(--team-primary) 0%, rgba(0,0,0,0) 70%);
            opacity: 0.35;
            pointer-events: none;
            transition: all 1.2s ease-in-out;
            z-index: 2;
            animation: pulseFlare 5s ease-in-out infinite alternate;
        }

        @keyframes pulseFlare {
            0% { opacity: 0.25; transform: translateX(-50%) scale(0.95); }
            100% { opacity: 0.5; transform: translateX(-50%) scale(1.08); }
        }

        header {
            z-index: 10;
            padding: 0.5vh 2vw 0.4vh;
            background: linear-gradient(180deg, rgba(1,3,8,0.98) 0%, rgba(1,3,8,0.7) 85%, transparent 100%);
            border-bottom: 2px solid var(--winning-color-1);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6), 0 0 12px var(--winning-color-1);
            transition: border-color 0.8s ease, box-shadow 0.8s ease;
            flex-shrink: 0;
        }

        .header-top-row {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            min-height: clamp(20px, 2.6vh, 32px);
        }

        .bar-title {
            font-family: 'Teko', sans-serif;
            font-size: clamp(1.3rem, 2.3vh, 2rem);
            line-height: 1;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            background: linear-gradient(180deg, #ffffff 20%, var(--winning-color-1) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px var(--winning-color-1);
            text-align: center;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            white-space: nowrap;
            pointer-events: none;
        }

        .live-clock {
            font-family: 'Oswald', sans-serif;
            font-size: clamp(0.6rem, 1vh, 0.9rem);
            color: var(--accent-gold);
            letter-spacing: 1.5px;
            text-shadow: 0 0 10px rgba(255, 234, 0, 0.6);
            z-index: 2;
        }

        .rotate-btn-icon {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            width: clamp(18px, 2.3vh, 24px);
            height: clamp(18px, 2.3vh, 24px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            z-index: 2;
        }

        .rotate-btn-icon:hover {
            background: rgba(0, 240, 255, 0.25);
            border-color: var(--primary-glow);
            transform: scale(1.1);
        }

        .rotate-btn-icon svg {
            width: 60%;
            height: 60%;
            fill: #ffffff;
        }

        .rotator-timer-bar {
            width: 100%;
            height: 2px;
            background: rgba(255, 255, 255, 0.1);
            position: absolute;
            bottom: 0;
            left: 0;
            overflow: hidden;
        }

        .rotator-progress {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--winning-color-1), var(--winning-color-2));
            box-shadow: 0 0 8px var(--winning-color-1);
            transition: width 0.1s linear;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 0.4vh 1.8vw;
            gap: 0.5vh;
            z-index: 5;
            overflow: hidden;
            position: relative;
        }

        .neon-card-wrapper {
            position: relative;
            border-radius: 10px;
            padding: 2px;
            background: linear-gradient(var(--neon-angle, 0deg), var(--winning-color-1), #010308, var(--winning-color-2), #010308, var(--winning-color-1));
            animation: rotateNeonBorder 4s linear infinite, pulseCardGlow 2.5s infinite alternate ease-in-out;
            box-shadow: 0 0 10px var(--winning-color-1);
            transition: background 0.8s ease, box-shadow 0.8s ease;
            overflow: hidden;
        }

        .neon-card-wrapper.matchup-wrap {
            flex: 1.35;
            min-height: 0;
        }

        .neon-card-wrapper.tape-wrap {
            flex: 0.95;
            min-height: 0;
        }

        .neon-card-wrapper.spotlight-wrap {
            flex: 0.95;
            min-height: 0;
        }

        @property --neon-angle {
            syntax: '<angle>';
            initial-value: 0deg;
            inherits: false;
        }

        @keyframes rotateNeonBorder {
            0% { --neon-angle: 0deg; }
            100% { --neon-angle: 360deg; }
        }

        @keyframes pulseCardGlow {
            0% { box-shadow: 0 0 6px var(--winning-color-1); }
            100% { box-shadow: 0 0 14px var(--winning-color-1), 0 0 22px var(--winning-color-2); }
        }

        body.rotated-90 main {
            padding: 0.6vh 2vw;
            gap: 0.6vh;
        }

        body.rotated-90 .logo-wrapper {
            width: clamp(80px, 12vh, 130px);
            height: clamp(80px, 12vh, 130px);
        }

        body.rotated-90 .team-name {
            font-size: clamp(1.1rem, 2vh, 1.8rem);
        }

        body.rotated-90 .team-record {
            font-size: clamp(0.55rem, 0.8vh, 0.75rem);
        }

        body.rotated-90 .score-display {
            font-size: clamp(1.9rem, 3.4vh, 2.9rem);
        }

        body.rotated-90 .player-headshot {
            width: clamp(95px, 15vh, 160px) !important;
            height: clamp(95px, 15vh, 160px) !important;
            border: 3px solid var(--winning-color-1);
            box-shadow: 0 0 14px var(--winning-color-1);
        }

        body.rotated-90 .player-name {
            font-size: clamp(0.7rem, 1.2vh, 1.05rem);
        }

        body.rotated-90 .player-stat-line {
            font-size: clamp(0.65rem, 1.1vh, 0.9rem);
            padding: 2px 6px;
        }

        body.rotated-90 .tape-metric-row {
            padding: 1px 6px;
            font-size: clamp(0.48rem, 0.72vh, 0.62rem);
        }

        body.rotated-90 .tape-bar-container {
            height: 4px;
        }

        body.rotated-90 .linescore-table {
            font-size: clamp(0.52rem, 0.8vh, 0.72rem);
        }

        body.rotated-90 .linescore-table td, body.rotated-90 .linescore-table th {
            padding: 1px 0;
        }

        .tape-card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 0.4vh 1vw;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
            width: 100%;
            backdrop-filter: blur(10px);
            overflow: hidden;
        }

        .tape-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Oswald', sans-serif;
            font-size: clamp(0.55rem, 0.9vh, 0.78rem);
            color: var(--accent-gold);
            letter-spacing: 1.2px;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(255,255,255,0.12);
            padding-bottom: 1px;
            margin-bottom: 1px;
        }

        .tape-metrics-grid {
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            gap: 1px;
            height: 100%;
            overflow-y: auto;
        }

        .tape-metric-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255,255,255,0.03);
            border-radius: 4px;
            padding: 1px 6px;
            font-size: clamp(0.46rem, 0.7vh, 0.6rem);
        }

        .tape-metric-label {
            color: #a0b0c0;
            font-family: 'Oswald', sans-serif;
            letter-spacing: 0.5px;
            width: 32%;
            text-transform: uppercase;
        }

        .tape-metric-val-away {
            color: #00f0ff;
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            width: 18%;
            text-align: right;
        }

        .tape-metric-val-home {
            color: #ff0055;
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            width: 18%;
            text-align: left;
        }

        .tape-bar-container {
            flex: 1;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            margin: 0 6px;
            position: relative;
            overflow: hidden;
            display: flex;
        }

        .tape-bar-fill-away {
            height: 100%;
            background: #00f0ff;
            transition: width 0.5s ease;
        }

        .tape-bar-fill-home {
            height: 100%;
            background: #ff0055;
            transition: width 0.5s ease;
        }

        .mlb-lineup-container {
            display: flex;
            flex-direction: column;
            gap: 4px;
            height: 100%;
            overflow-y: auto;
            font-family: 'Oswald', sans-serif;
            font-size: clamp(0.44rem, 0.65vh, 0.58rem);
        }

        .mlb-lineup-section-title {
            color: var(--accent-gold);
            font-weight: 700;
            letter-spacing: 0.8px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 1px;
            margin-bottom: 2px;
            text-transform: uppercase;
        }

        .mlb-lineup-table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }

        .mlb-lineup-table th {
            color: #8a9ba8;
            font-weight: 500;
            border-bottom: 1px solid rgba(255,255,255,0.15);
            padding: 1px 0;
        }

        .mlb-lineup-table td {
            color: #ffffff;
            padding: 1.5px 2px;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }

        .mlb-lineup-table td:nth-child(2) {
            text-align: left;
        }

        .redzone-alert-banner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.7);
            width: 90%;
            background: rgba(20, 0, 5, 0.95);
            border: 4px solid var(--redzone-red);
            box-shadow: 0 0 40px var(--redzone-red), inset 0 0 20px var(--redzone-red);
            border-radius: 12px;
            padding: 1.5vh 2vw;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(15px);
        }

        .redzone-alert-banner.active {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .redzone-header-title {
            font-family: 'Teko', sans-serif;
            font-size: clamp(2rem, 4vh, 3.2rem);
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 12px var(--redzone-red);
        }

        .redzone-matchup-sub {
            font-family: 'Oswald', sans-serif;
            font-size: clamp(0.9rem, 1.8vh, 1.5rem);
            color: #ffffff;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 2px;
        }

        .redzone-details-badge {
            background: var(--redzone-red);
            color: #ffffff;
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            font-size: clamp(0.7rem, 1.3vh, 1.1rem);
            padding: 2px 12px;
            border-radius: 4px;
            margin-top: 8px;
            letter-spacing: 1.5px;
        }

        .matchup-card, .spotlight-card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 0.4vh 1vw;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            height: 100%;
            width: 100%;
            backdrop-filter: blur(10px);
            transition: opacity 0.4s ease-in-out, transform 0.4s ease-in-out;
            opacity: 1;
            transform: scale(1);
            overflow: hidden;
        }

        .matchup-card.fade-out, .spotlight-card.fade-out, .tape-card.fade-out {
            opacity: 0;
            transform: scale(0.98);
        }

        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.1vh;
            padding-bottom: 0.1vh;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        }

        .status-left-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .game-status {
            font-family: 'Oswald', sans-serif;
            font-size: clamp(0.5rem, 0.8vh, 0.7rem);
            padding: 1px 4px;
            border-radius: 3px;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.8px;
        }

        .status-live {
            background: #ff0044;
            color: #fff;
            animation: pulse-red 1.5s infinite;
        }

        .status-pregame {
            background: rgba(0, 240, 255, 0.2);
            color: #00f0ff;
            border: 1px solid #00f0ff;
        }

        .status-final {
            background: rgba(255, 255, 255, 0.15);
            color: #aaa;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .momentum-badge {
            font-family: 'Oswald', sans-serif;
            font-size: clamp(0.48rem, 0.7vh, 0.65rem);
            color: #ffea00;
            background: rgba(255, 234, 0, 0.15);
            border: 1px solid rgba(255, 234, 0, 0.5);
            padding: 1px 4px;
            border-radius: 3px;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            display: none;
        }

        .momentum-badge.active {
            display: inline-block;
        }

        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(255, 0, 68, 0.8); }
            70% { box-shadow: 0 0 0 5px rgba(255, 0, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 0, 68, 0); }
        }

        .meta-badges {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .badge-pill {
            font-size: clamp(0.48rem, 0.7vh, 0.65rem);
            color: var(--accent-gold);
            font-weight: 700;
            font-family: 'Oswald', sans-serif;
            letter-spacing: 0.6px;
            background: rgba(255, 234, 0, 0.08);
            padding: 1px 4px;
            border-radius: 3px;
            border: 1px solid rgba(255, 234, 0, 0.3);
        }

        .playoff-badge {
            font-size: clamp(0.48rem, 0.7vh, 0.65rem);
            color: #00f0ff;
            font-weight: 700;
            font-family: 'Oswald', sans-serif;
            letter-spacing: 0.6px;
            background: rgba(0, 240, 255, 0.1);
            padding: 1px 4px;
            border-radius: 3px;
            border: 1px solid rgba(0, 240, 255, 0.35);
        }

        .network-info {
            font-size: clamp(0.5rem, 0.78vh, 0.7rem);
            color: #00f0ff;
            font-weight: 700;
            font-family: 'Oswald', sans-serif;
            letter-spacing: 0.6px;
        }

        .teams-container {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 1vw;
            margin: auto 0;
        }

        .team-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .logo-wrapper {
            width: clamp(60px, 8.5vh, 100px);
            height: clamp(60px, 8.5vh, 100px);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 0.1vh;
            z-index: 10;
        }

        .team-logo {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            position: relative;
            z-index: 10;
        }

        .team-name {
            font-family: 'Teko', sans-serif;
            font-size: clamp(1rem, 1.6vh, 1.4rem);
            font-weight: 700;
            line-height: 0.85;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .team-record {
            font-size: clamp(0.48rem, 0.65vh, 0.6rem);
            color: #8a9ba8;
            margin-top: 1px;
            font-family: 'Oswald', sans-serif;
        }

        .score-display {
            font-family: 'Oswald', sans-serif;
            font-size: clamp(1.4rem, 2.4vh, 2.1rem);
            font-weight: 700;
            color: #ffffff;
            line-height: 1;
            margin-top: 1px;
            text-shadow: 0 0 10px var(--winning-color-1);
        }

        .vs-divider {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
        }

        .vs-text {
            font-family: 'Teko', sans-serif;
            font-size: clamp(0.9rem, 1.4vh, 1.2rem);
            color: var(--accent-gold);
            font-weight: 700;
        }

        .game-time {
            font-family: 'Oswald', sans-serif;
            font-size: clamp(0.5rem, 0.75vh, 0.65rem);
            color: #ffffff;
            text-align: center;
            letter-spacing: 0.6px;
        }

        .linescore-table-container {
            width: 100%;
            background: rgba(2, 4, 8, 0.75);
            border: 1px solid rgba(0, 240, 255, 0.25);
            border-radius: 4px;
            padding: 2px 6px;
            margin-top: 0.1vh;
        }

        .linescore-table {
            width: 100%;
            border-collapse: collapse;
            font-family: 'Oswald', sans-serif;
            font-size: clamp(0.5rem, 0.78vh, 0.65rem);
            text-align: center;
        }

        .linescore-table th {
            color: #8a9ba8;
            font-weight: 500;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 1px;
        }

        .linescore-table td {
            color: #ffffff;
            padding: 1px 0;
        }

        .linescore-table td:first-child, .linescore-table th:first-child {
            text-align: left;
            padding-left: 4px;
        }

        .win-prob-wrapper {
            width: 100%;
            background: rgba(2, 4, 8, 0.8);
            border: 1px solid rgba(255, 234, 0, 0.3);
            border-radius: 4px;
            padding: 2px 6px;
            margin-top: 0.1vh;
            display: flex;
            flex-direction: column;
            gap: 1px;
        }

        .win-prob-header {
            display: flex;
            justify-content: space-between;
            font-family: 'Oswald', sans-serif;
            font-size: clamp(0.5rem, 0.75vh, 0.62rem);
            color: var(--accent-gold);
            text-transform: uppercase;
        }

        .win-prob-bar-container {
            width: 100%;
            height: 5px;
            background: rgba(255,255,255,0.1);
            border-radius: 2.5px;
            display: flex;
            overflow: hidden;
        }

        .win-prob-away-fill {
            height: 100%;
            background: #00f0ff;
            transition: width 0.5s ease;
        }

        .win-prob-home-fill {
            height: 100%;
            background: #ff0055;
            transition: width 0.5s ease;
        }

        .sport-graphic-container {
            width: 100%;
            background: linear-gradient(180deg, #051428 0%, #010814 100%);
            border: 1.5px solid rgba(0, 240, 255, 0.45);
            border-radius: 5px;
            padding: 0.3vh 0.5vw;
            margin-top: 0.1vh;
            display: none;
            flex-direction: column;
            align-items: center;
        }

        .graphic-title-text {
            font-family: 'Oswald', sans-serif;
            font-size: clamp(0.55rem, 0.82vh, 0.7rem);
            color: var(--accent-gold);
            letter-spacing: 1px;
            font-weight: 700;
            margin-bottom: 1px;
            text-transform: uppercase;
        }

        .football-field {
            width: 100%;
            height: clamp(24px, 2.8vh, 30px);
            background: #0d2818;
            border: 1.5px solid rgba(255, 255, 255, 0.4);
            border-radius: 3px;
            position: relative;
            display: flex;
            overflow: hidden;
        }

        .endzone {
            width: 10%;
            height: 100%;
            display: flex;
            align-items: center;
