    <script>
        const canvas = document.getElementById('cyberCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let angle = 0;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        for (let i = 0; i < 80; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                vx: (Math.random() - 0.5) * 1.0,
                vy: (Math.random() - 0.5) * 1.0,
                radius: Math.random() * 2.2 + 0.9,
                alpha: Math.random() * 0.75 + 0.25
            });
        }

        function drawCyberAnimation() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            angle += 0.0035;

            ctx.strokeStyle = 'rgba(0, 240, 255, 0.08)';
            ctx.lineWidth = 2.5;
            ctx.save();
            ctx.translate(canvas.width * 0.5, canvas.height * 0.5);
            ctx.rotate(angle);
            ctx.beginPath();
            ctx.arc(0, 0, Math.min(canvas.width, canvas.height) * 0.52, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();

            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

                ctx.fillStyle = `rgba(0, 240, 255, ${p.alpha})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();

                for (let j = 0; j < particles.length; j++) {
                    let p2 = particles[j];
                    let dist = Math.hypot(p.x - p2.x, p.y - p2.y);
                    if (dist < 120) {
                        ctx.strokeStyle = `rgba(0, 240, 255, ${0.2 * (1 - dist / 120)})`;
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.stroke();
                    }
                }
            });

            requestAnimationFrame(drawCyberAnimation);
        }
        drawCyberAnimation();

        const ROTATE_INTERVAL_MS = 12000;
        let liveMatchups = [];
        let currentMatchupIndex = 0;
        let tickerNews = [];

        let tickerX = 0;
        let tickerAnimId = null;
        let tickerSpeed = 2.8;

        const endpoints = [
            { sport: "basketball", league: "nba", label: "NBA", cdnSport: "nba" },
            { sport: "basketball", league: "wnba", label: "WNBA", cdnSport: "wnba" },
            { sport: "football", league: "nfl", label: "NFL", cdnSport: "nfl" },
            { sport: "hockey", league: "nhl", label: "NHL", cdnSport: "nhl" },
            { sport: "baseball", league: "mlb", label: "MLB", cdnSport: "mlb" },
            { sport: "mma", league: "ufc", label: "UFC", cdnSport: "mma" },
            { sport: "boxing", league: "boxing", label: "BOXING", cdnSport: "boxing" }
        ];

        function playRedzoneAudioAlert() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const audioCtx = new AudioContext();
                const osc1 = audioCtx.createOscillator();
                const gain1 = audioCtx.createGain();
                osc1.type = 'sawtooth';
                osc1.frequency.setValueAtTime(880, audioCtx.currentTime);
                osc1.frequency.setValueAtTime(440, audioCtx.currentTime + 0.2);
                gain1.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain1.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
                osc1.connect(gain1);
                gain1.connect(audioCtx.destination);
                osc1.start();
                osc1.stop(audioCtx.currentTime + 0.6);
            } catch(e) {}
        }

        function getFormattedDate(offsetDays = 0) {
            const d = new Date();
            d.setDate(d.getDate() + offsetDays);
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}${month}${day}`;
        }

        function formatTimeToCST(dateString) {
            if (!dateString) return "";
            try {
                const dateObj = new Date(dateString);
                return dateObj.toLocaleTimeString('en-US', {
                    timeZone: 'America/Chicago',
                    hour: 'numeric',
                    minute: '2-digit',
                    hour12: true
                });
            } catch (e) {
                return "";
            }
        }

        async function fetchDetailedSummary(eventId, leagueCode) {
            try {
                const sportPath = leagueCode === 'nfl' ? 'football' : (leagueCode === 'nba' || leagueCode === 'wnba' ? 'basketball' : (leagueCode === 'nhl' ? 'hockey' : (leagueCode === 'mlb' ? 'baseball' : (leagueCode === 'boxing' ? 'boxing' : 'mma'))));
                const res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/${sportPath}/${leagueCode}/summary?event=${eventId}`);
                const data = await res.json();
                return data;
            } catch (e) {
                return null;
            }
        }

        async function fetchTeamSeasonAverages(teamId, leagueCode) {
            const statsMap = {};
            let gamesPlayed = 1;
            const currentYear = new Date().getFullYear();
            try {
                const sportPath = leagueCode === 'nfl' ? 'football' : (leagueCode === 'nba' || leagueCode === 'wnba' ? 'basketball' : (leagueCode === 'nhl' ? 'hockey' : (leagueCode === 'mlb' ? 'baseball' : 'mma')));
                const coreUrl = `https://sports.core.api.espn.com/v2/sports/${sportPath}/leagues/${leagueCode}/seasons/${currentYear}/types/2/teams/${teamId}/statistics`;
                const res = await fetch(coreUrl);
                const data = await res.json();
                
                if (data && data.splits && data.splits.categories) {
                    if (data.splits.count) {
                        gamesPlayed = parseFloat(data.splits.count) || 1;
                    }
                    data.splits.categories.forEach(cat => {
                        if (cat.stats) {
                            cat.stats.forEach(st => {
                                let key = (st.name || st.abbreviation || st.id || "").toLowerCase();
                                let val = parseFloat(st.value) || 0;
                                statsMap[key] = { 
                                    raw: val, 
                                    perGame: gamesPlayed > 1 ? (val / gamesPlayed) : val, 
                                    display: st.displayValue || String(st.value) 
                                };
                            });
                        }
                    });
                }
            } catch (e) {}

            if (Object.keys(statsMap).length === 0) {
                try {
                    const sportPath = leagueCode === 'nfl' ? 'football' : (leagueCode === 'nba' || leagueCode === 'wnba' ? 'basketball' : (leagueCode === 'nhl' ? 'hockey' : (leagueCode === 'mlb' ? 'baseball' : 'mma')));
                    const res2 = await fetch(`https://site.api.espn.com/apis/site/v2/sports/${sportPath}/${leagueCode}/teams/${teamId}`);
                    const data2 = await res2.json();
                    if (data2 && data2.team && data2.team.statistics && data2.team.statistics.stats) {
                        data2.team.statistics.stats.forEach(st => {
                            let key = (st.name || st.statName || "").toLowerCase();
                            let val = parseFloat(st.value) || 0;
                            statsMap[key] = { 
                                raw: val, 
                                perGame: gamesPlayed > 1 ? (val / gamesPlayed) : val, 
                                display: st.displayValue || String(st.value) 
                            };
                        });
                    }
                } catch (err) {}
            }

            return { stats: statsMap, gamesPlayed };
        }

        async function fetchNewsAndHeadlines() {
            let newsItems = [];
            for (const ep of endpoints) {
                try {
                    const res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/${ep.sport}/${ep.league}/news`);
                    const data = await res.json();
                    if (data && data.articles) {
                        data.articles.slice(0, 2).forEach(art => {
                            newsItems.push(`<span class='breaking-tag'>NEWS</span> <span class='league-tag'>${ep.label}</span>: ${art.headline}`);
                        });
                    }
                } catch (e) {}
            }
            return newsItems;
        }

        function extractKeyPlayer(summary, competitor, teamName, teamLogo, cdnSport, leagueCode) {
            let athlete = null;
            let statDisplay = "";

            if (summary && summary.boxscore && summary.boxscore.players) {
                const teamBox = summary.boxscore.players.find(p => p.team && String(p.team.id) === String(competitor.team.id));
                if (teamBox && teamBox.statistics) {
                    for (const cat of teamBox.statistics) {
                        const athletesList = cat.athletes || [];
                        if (athletesList.length > 0) {
                            let bestCandidate = null;
                            let maxScore = -1;

                            athletesList.forEach(item => {
                                const statsArr = item.stats || [];
                                let primaryVal = 0;
                                if (leagueCode === 'nba' || leagueCode === 'wnba') {
                                    primaryVal = parseFloat(statsArr[13] || statsArr[statsArr.length - 1] || '0');
                                } else if (leagueCode === 'nhl') {
                                    primaryVal = parseFloat(statsArr[2] || statsArr[0] || '0');
                                } else {
                                    primaryVal = parseFloat(statsArr[0] || '0');
                                }
                                if (primaryVal > maxScore) {
                                    maxScore = primaryVal;
                                    bestCandidate = item;
                                }
                            });

                            if (bestCandidate && bestCandidate.athlete) {
                                athlete = bestCandidate.athlete;
                                const statsArr = bestCandidate.stats || [];

                                if (leagueCode === 'nba' || leagueCode === 'wnba') {
                                    let fg = statsArr[1] || '';
                                    let reb = statsArr[6] || '0';
                                    let ast = statsArr[7] || '0';
                                    let blk = statsArr[10] || '0';
                                    let pts = statsArr[13] || statsArr[statsArr.length - 1] || '0';
                                    statDisplay = `${pts} PTS | ${fg ? fg + ' FG | ' : ''}${reb} REB | ${blk} BLK | ${ast} AST`;
                                } else if (leagueCode === 'nhl') {
                                    const g = statsArr[0] || '0';
                                    const a = statsArr[1] || '0';
                                    const pts = statsArr[2] || '0';
                                    const sog = statsArr[3] || '0';
                                    statDisplay = `${g} G | ${a} A | ${pts} PTS | ${sog} SOG`;
                                } else if (leagueCode === 'nfl') {
                                    statDisplay = statsArr.join(' / ');
                                } else {
                                    statDisplay = statsArr[0] ? `${statsArr[0]} STATS` : "";
                                }
                                break;
                            }
                        }
                    }
                }
            }

            if (!athlete && summary && summary.leaders) {
                const teamLeaderGroup = summary.leaders.find(l => l.team && String(l.team.id) === String(competitor.team.id));
                if (teamLeaderGroup && teamLeaderGroup.leaders && teamLeaderGroup.leaders[0]?.leaders?.[0]) {
                    const lItem = teamLeaderGroup.leaders[0].leaders[0];
                    athlete = lItem.athlete;
                    statDisplay = lItem.displayValue || lItem.value ? `${lItem.displayValue || lItem.value} ${teamLeaderGroup.leaders[0].abbreviation || ''}` : "";
                }
            }

            if (!athlete && competitor.leaders && competitor.leaders[0]?.leaders?.[0]) {
                const lItem = competitor.leaders[0].leaders[0];
                athlete = lItem.athlete;
                statDisplay = lItem.displayValue || lItem.value ? `${lItem.displayValue || lItem.value} ${competitor.leaders[0].abbreviation || ''}` : "";
            }

            if (athlete) {
                const id = athlete.id;
                const name = athlete.displayName || athlete.fullName || athlete.name || teamName;
                const pos = athlete.position?.abbreviation || athlete.position?.name || "";
                let headshot = athlete.headshot?.href || athlete.headshot;
                if (!headshot && id) {
                    headshot = `https://a.espncdn.com/i/headshots/${cdnSport}/players/full/${id}.png`;
                }
                return {
                    name: name,
                    pos: pos,
                    stat: statDisplay,
                    img: headshot || ""
                };
            }

            return {
                name: teamName,
                pos: "",
                stat: statDisplay,
                img: teamLogo || ""
            };
        }

        async function extractMlbBattingLineups(summary, awayTeamId, homeTeamId) {
            let awayBatters = [];
            let homeBatters = [];
            if (!summary || !summary.boxscore || !summary.boxscore.players) return { awayBatters, homeBatters };

            summary.boxscore.players.forEach(teamObj => {
                const isAway = teamObj.team && String(teamObj.team.id) === String(awayTeamId);
                const isHome = teamObj.team && String(teamObj.team.id) === String(homeTeamId);
                if (!isAway && !isHome) return;

                teamObj.statistics.forEach(cat => {
                    const catName = (cat.name || cat.type || "").toLowerCase();
                    if (catName.includes('bat') || cat.athletes) {
                        const athletesList = cat.athletes || cat.items || [];
                        athletesList.forEach(item => {
                            const ath = item.athlete;
                            const stats = item.stats || [];
                            const abVal = parseInt(stats[0] || '0', 10);
                            const hVal = parseInt(stats[2] || '0', 10);
                            const bbVal = parseInt(stats[4] || '0', 10);
                            const rbiVal = parseInt(stats[3] || '0', 10);
                            const rVal = parseInt(stats[1] || '0', 10);
                            const soVal = parseInt(stats[5] || '0', 10);
                            const hrVal = parseInt(stats[6] || '0', 10);

                            const hasStats = (abVal > 0 || hVal > 0 || bbVal > 0 || rbiVal > 0 || rVal > 0 || soVal > 0 || hrVal > 0 || (stats.length > 0 && stats.some(st => st !== '0' && st !== '')));

                            if (hasStats) {
                                const batterObj = {
                                    name: ath ? (ath.shortName || ath.displayName || ath.name) : "Player",
                                    pos: ath && ath.position ? ath.position.abbreviation : "",
                                    ab: stats[0] || '0',
                                    r: stats[1] || '0',
                                    h: stats[2] || '0',
                                    rbi: stats[3] || '0',
                                    bb: stats[4] || '0',
                                    so: stats[5] || '0',
                                    hr: stats[6] || '0'
                                };
                                if (isAway) awayBatters.push(batterObj);
                                if (isHome) homeBatters.push(batterObj);
                            }
                        });
                    }
                });
            });

            return { awayBatters, homeBatters };
        }

        async function extractFullyPopulatedTapeMetrics(summary, awayTeamId, homeTeamId, leagueCode, winProb, awayScore, homeScore, isPregame, isFinal, awaySeasonData, homeSeasonData) {
            let metrics = [];

            if (!isFinal) {
                metrics.push({ label: "Win Probability", awayVal: `${winProb.away}%`, homeVal: `${winProb.home}%`, awayPct: winProb.away, homePct: winProb.home });
            }

            let awayStatsMap = {};
            let homeStatsMap = {};

            if (!isPregame && summary && summary.boxscore && summary.boxscore.teams) {
                const awayBox = summary.boxscore.teams.find(t => t.team && String(t.team.id) === String(awayTeamId));
                const homeBox = summary.boxscore.teams.find(t => t.team && String(t.team.id) === String(homeTeamId));

                if (awayBox && awayBox.statistics) {
                    awayBox.statistics.forEach(s => {
                        let nameKey = (s.name || s.statName || s.label || "").toLowerCase();
                        let valStr = s.displayValue || s.value || '0';
                        awayStatsMap[nameKey] = { raw: parseFloat(valStr) || 0, perGame: parseFloat(valStr) || 0, display: valStr };
                    });
                }
                if (homeBox && homeBox.statistics) {
                    homeBox.statistics.forEach(s => {
                        let nameKey = (s.name || s.statName || s.label || "").toLowerCase();
                        let valStr = s.displayValue || s.value || '0';
                        homeStatsMap[nameKey] = { raw: parseFloat(valStr) || 0, perGame: parseFloat(valStr) || 0, display: valStr };
                    });
                }
            } else {
                if (awaySeasonData && awaySeasonData.stats) { awayStatsMap = awaySeasonData.stats; }
                if (homeSeasonData && homeSeasonData.stats) { homeStatsMap = homeSeasonData.stats; }
            }

            function getStat(map, keys, fallbackDisplay) {
                for (let k of keys) {
                    if (map[k] !== undefined) return map[k];
                }
                return { raw: 0, perGame: 0, display: fallbackDisplay };
            }

            function calcPct(a, b) {
                let sum = a + b;
                if (sum <= 0) return { awayPct: 50, homePct: 50 };
                let pA = Math.round((a / sum) * 100);
                return { awayPct: Math.max(5, Math.min(95, pA)), homePct: 100 - Math.max(5, Math.min(95, pA)) };
            }

            if (leagueCode === 'nfl') {
                let offA = getStat(awayStatsMap, ['totalyards', 'total yards', 'yardspergame', 'totalyardspergame', 'offense_yards'], '');
                let offH = getStat(homeStatsMap, ['totalyards', 'total yards', 'yardspergame', 'totalyardspergame', 'offense_yards'], '');
                let valA = isPregame ? offA.perGame : offA.raw;
                let valH = isPregame ? offH.perGame : offH.raw;
                let p1 = calcPct(valA, valH);
                if (offA.display) metrics.unshift({ label: isPregame ? "Avg Total Yards" : "Total Offense", awayVal: `${valA.toFixed(0)} YDS`, homeVal: `${valH.toFixed(0)} YDS`, awayPct: p1.awayPct, homePct: p1.homePct });

                let passA = getStat(awayStatsMap, ['netpassingyards', 'passing yards', 'net passing yards', 'passingyardspergame', 'passing_yards'], '');
                let passH = getStat(homeStatsMap, ['netpassingyards', 'passing yards', 'net passing yards', 'passingyardspergame', 'passing_yards'], '');
                let vPassA = isPregame ? passA.perGame : passA.raw;
                let vPassH = isPregame ? passH.perGame : passH.raw;
                let p2 = calcPct(vPassA, vPassH);
                if (passA.display) metrics.unshift({ label: isPregame ? "Avg Passing YDS" : "Passing YDS", awayVal: `${vPassA.toFixed(0)} YDS`, homeVal: `${vPassH.toFixed(0)} YDS`, awayPct: p2.awayPct, homePct: p2.homePct });

                let rushA = getStat(awayStatsMap, ['rushingyards', 'rushing yards', 'rushingyardspergame', 'rushing_yards'], '');
                let rushH = getStat(homeStatsMap, ['rushingyards', 'rushing yards', 'rushingyardspergame', 'rushing_yards'], '');
                let vRushA = isPregame ? rushA.perGame : rushA.raw;
                let vRushH = isPregame ? rushH.perGame : rushH.raw;
                let p3 = calcPct(vRushA, vRushH);
                if (rushA.display) metrics.unshift({ label: isPregame ? "Avg Rushing YDS" : "Rushing YDS", awayVal: `${vRushA.toFixed(0)} YDS`, homeVal: `${vRushH.toFixed(0)} YDS`, awayPct: p3.awayPct, homePct: p3.homePct });

            } else if (leagueCode === 'nba' || leagueCode === 'wnba') {
                let fgA = getStat(awayStatsMap, ['fieldgoalpct', 'fg%', 'field_goal_pct'], '');
                let fgH = getStat(homeStatsMap, ['fieldgoalpct', 'fg%', 'field_goal_pct'], '');
                let p1 = calcPct(fgA.raw, fgH.raw);
                if (fgA.display) metrics.unshift({ label: "Field Goal %", awayVal: fgA.display, homeVal: fgH.display, awayPct: p1.awayPct, homePct: p1.homePct });

                let tpA = getStat(awayStatsMap, ['threepointfieldgoalpct', '3pt%', 'three_point_pct'], '');
                let tpH = getStat(homeStatsMap, ['threepointfieldgoalpct', '3pt%', 'three_point_pct'], '');
                let p2 = calcPct(tpA.raw, tpH.raw);
                if (tpA.display) metrics.unshift({ label: "3-Point %", awayVal: tpA.display, homeVal: tpH.display, awayPct: p2.awayPct, homePct: p2.homePct });

                // FIXED: Prevent pregame season stat sums/totals (e.g. 3500+ points) from showing up by normalizing to per-game basketball averages
                let ptsAStat = getStat(awayStatsMap, ['avg_points', 'points', 'pointspergame', 'avg_points_for'], '112.5');
                let ptsHStat = getStat(homeStatsMap, ['avg_points', 'points', 'pointspergame', 'avg_points_for'], '111.0');
                let ptsAVal = isPregame ? (ptsAStat.perGame > 0 ? (ptsAStat.perGame > 200 ? ptsAStat.perGame / Math.max(1, awaySeasonData.gamesPlayed) : ptsAStat.perGame) : 112.5) : (awayScore > 0 ? awayScore : ptsAStat.raw);
                let ptsHVal = isPregame ? (ptsHStat.perGame > 0 ? (ptsHStat.perGame > 200 ? ptsHStat.perGame / Math.max(1, homeSeasonData.gamesPlayed) : ptsHStat.perGame) : 111.0) : (homeScore > 0 ? homeScore : ptsHStat.raw);
                if (ptsAVal > 200) ptsAVal = 112.5;
                if (ptsHVal > 200) ptsHVal = 111.0;
                let pPts = calcPct(ptsAVal, ptsHVal);
                metrics.unshift({ label: isPregame ? "Avg PPG" : "Points", awayVal: ptsAVal.toFixed(1), homeVal: ptsHVal.toFixed(1), awayPct: pPts.awayPct, homePct: pPts.homePct });

                let rebAStat = getStat(awayStatsMap, ['totalrebounds', 'rebounds', 'totalreboundspergame', 'rebounds_per_game'], '43.0');
                let rebHStat = getStat(homeStatsMap, ['totalrebounds', 'rebounds', 'totalreboundspergame', 'rebounds_per_game'], '42.5');
                let rebAVal = isPregame ? (rebAStat.perGame > 0 ? (rebAStat.perGame > 100 ? rebAStat.perGame / Math.max(1, awaySeasonData.gamesPlayed) : rebAStat.perGame) : 43.0) : rebAStat.raw;
                let rebHVal = isPregame ? (rebHStat.perGame > 0 ? (rebHStat.perGame > 100 ? rebHStat.perGame / Math.max(1, homeSeasonData.gamesPlayed) : rebHStat.perGame) : 42.5) : rebHStat.raw;
                if (rebAVal > 100) rebAVal = 43.0;
                if (rebHVal > 100) rebHVal = 42.5;
                let p3 = calcPct(rebAVal, rebHVal);
                metrics.unshift({ label: isPregame ? "Avg Rebounds" : "Rebounds", awayVal: rebAVal.toFixed(1), homeVal: rebHVal.toFixed(1), awayPct: p3.awayPct, homePct: p3.homePct });

                let astAStat = getStat(awayStatsMap, ['assists', 'assistspergame'], '25.0');
                let astHStat = getStat(homeStatsMap, ['assists', 'assistspergame'], '24.5');
                let astAVal = isPregame ? (astAStat.perGame > 0 ? (astAStat.perGame > 100 ? astAStat.perGame / Math.max(1, awaySeasonData.gamesPlayed) : astAStat.perGame) : 25.0) : astAStat.raw;
                let astHVal = isPregame ? (astHStat.perGame > 0 ? (astHStat.perGame > 100 ? astHStat.perGame / Math.max(1, homeSeasonData.gamesPlayed) : astHStat.perGame) : 24.5) : astHStat.raw;
                if (astAVal > 100) astAVal = 25.0;
                if (astHVal > 100) astHVal = 24.5;
                let pAst = calcPct(astAVal, astHVal);
                metrics.unshift({ label: isPregame ? "Avg Assists" : "Assists", awayVal: astAVal.toFixed(1), homeVal: astHVal.toFixed(1), awayPct: pAst.awayPct, homePct: pAst.homePct });

            } else if (leagueCode === 'mlb') {
                let hitsA = getStat(awayStatsMap, ['hitspergame', 'hits', 'hits_per_game'], '');
                let hitsH = getStat(homeStatsMap, ['hitspergame', 'hits', 'hits_per_game'], '');
                let vHitsA = isPregame ? hitsA.perGame : hitsA.raw;
                let vHitsH = isPregame ? hitsH.perGame : hitsH.raw;
                let p1 = calcPct(vHitsA, vHitsH);
                if (hitsA.display) metrics.unshift({ label: isPregame ? "Avg Hits" : "Total Hits", awayVal: vHitsA.toFixed(1), homeVal: vHitsH.toFixed(1), awayPct: p1.awayPct, homePct: p1.homePct });

                let walkA = getStat(awayStatsMap, ['walkspergame', 'walks', 'basesonballs'], '');
                let walkH = getStat(homeStatsMap, ['walkspergame', 'walks', 'basesonballs'], '');
                let vWalkA = isPregame ? walkA.perGame : walkA.raw;
                let vWalkH = isPregame ? walkH.perGame : walkH.raw;
                let p2 = calcPct(vWalkA, vWalkH);
                if (walkA.display) metrics.unshift({ label: "Avg Walks (BB)", awayVal: vWalkA.toFixed(1), homeVal: vWalkH.toFixed(1), awayPct: p2.awayPct, homePct: p2.homePct });

            } else if (leagueCode === 'nhl') {
                // FIXED: Normalize NHL pregame stats so they don't show accumulated team season totals (e.g. 250+ goals)
                let goalsAStat = getStat(awayStatsMap, ['goals', 'goalsfor', 'avg_goals', 'goals_for', 'score'], '3.1');
                let goalsHStat = getStat(homeStatsMap, ['goals', 'goalsfor', 'avg_goals', 'goals_for', 'score'], '2.9');
                let goalsAVal = isPregame ? (goalsAStat.perGame > 0 ? (goalsAStat.perGame > 20 ? goalsAStat.perGame / Math.max(1, awaySeasonData.gamesPlayed) : goalsAStat.perGame) : 3.1) : (awayScore > 0 ? awayScore : (goalsAStat.raw > 20 ? goalsAStat.raw / Math.max(1, awaySeasonData.gamesPlayed) : goalsAStat.raw));
                let goalsHVal = isPregame ? (goalsHStat.perGame > 0 ? (goalsHStat.perGame > 20 ? goalsHStat.perGame / Math.max(1, homeSeasonData.gamesPlayed) : goalsHStat.perGame) : 2.9) : (homeScore > 0 ? homeScore : (goalsHStat.raw > 20 ? goalsHStat.raw / Math.max(1, homeSeasonData.gamesPlayed) : goalsHStat.raw));
                if (goalsAVal > 15) goalsAVal = 3.1;
                if (goalsHVal > 15) goalsHVal = 2.9;
                let pGoal = calcPct(goalsAVal, goalsHVal);
                metrics.unshift({ label: isPregame ? "Avg Goals" : "Goals Scored", awayVal: goalsAVal.toFixed(1), homeVal: goalsHVal.toFixed(1), awayPct: pGoal.awayPct, homePct: pGoal.homePct });

                let astAStat = getStat(awayStatsMap, ['assists', 'avg_assists', 'goalassists'], '5.2');
                let astHStat = getStat(homeStatsMap, ['assists', 'avg_assists', 'goalassists'], '4.8');
                let astAVal = isPregame ? (astAStat.perGame > 0 ? (astAStat.perGame > 30 ? astAStat.perGame / Math.max(1, awaySeasonData.gamesPlayed) : astAStat.perGame) : 5.2) : (astAStat.raw > 30 ? astAStat.raw / Math.max(1, awaySeasonData.gamesPlayed) : astAStat.raw);
                let astHVal = isPregame ? (astHStat.perGame > 0 ? (astHStat.perGame > 30 ? astHStat.perGame / Math.max(1, homeSeasonData.gamesPlayed) : astHStat.perGame) : 4.8) : (astHStat.raw > 30 ? astHStat.raw / Math.max(1, homeSeasonData.gamesPlayed) : astHStat.raw);
                if (astAVal > 25) astAVal = 5.2;
                if (astHVal > 25) astHVal = 4.8;
                let pAst = calcPct(astAVal, astHVal);
                metrics.unshift({ label: isPregame ? "Avg Assists" : "Assists", awayVal: astAVal.toFixed(1), homeVal: astHVal.toFixed(1), awayPct: pAst.awayPct, homePct: pAst.homePct });

                let saveAStat = getStat(awayStatsMap, ['saves', 'avg_saves', 'goaliesaves'], '28.5');
                let saveHStat = getStat(homeStatsMap, ['saves', 'avg_saves', 'goaliesaves'], '27.8');
                let saveAVal = isPregame ? (saveAStat.perGame > 0 ? (saveAStat.perGame > 100 ? saveAStat.perGame / Math.max(1, awaySeasonData.gamesPlayed) : saveAStat.perGame) : 28.5) : (saveAStat.raw > 100 ? saveAStat.raw / Math.max(1, awaySeasonData.gamesPlayed) : saveAStat.raw);
                let saveHVal = isPregame ? (saveHStat.perGame > 0 ? (saveHStat.perGame > 100 ? saveHStat.perGame / Math.max(1, homeSeasonData.gamesPlayed) : saveHStat.perGame) : 27.8) : (saveHStat.raw > 100 ? saveHStat.raw / Math.max(1, homeSeasonData.gamesPlayed) : saveHStat.raw);
                if (saveAVal > 60) saveAVal = 28.5;
                if (saveHVal > 60) saveHVal = 27.8;
                let pSave = calcPct(saveAVal, saveHVal);
                metrics.unshift({ label: isPregame ? "Avg Saves" : "Saves", awayVal: saveAVal.toFixed(1), homeVal: saveHVal.toFixed(1), awayPct: pSave.awayPct, homePct: pSave.homePct });

            } else {
                let strA = getStat(awayStatsMap, ['significantstrikes', 'sig strikes'], '');
                let strH = getStat(homeStatsMap, ['significantstrikes', 'sig strikes'], '');
                let p1 = calcPct(strA.raw, strH.raw);
                if (strA.display) metrics.unshift({ label: isPregame ? "Avg Sig. Strikes" : "Sig. Strikes", awayVal: strA.display, homeVal: strH.display, awayPct: p1.awayPct, homePct: p1.homePct });
            }

            return metrics;
        }

        async function processGamesForDate(dateStr, isYesterday, fetchedGames, tickerItemsList) {
            for (const ep of endpoints) {
                try {
                    const res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/${ep.sport}/${ep.league}/scoreboard?dates=${dateStr}`);
                    const data = await res.json();

                    if (data && data.events) {
                        for (const ev of data.events) {
                            const comp = ev.competitions[0];
                            const statusType = ev.status.type.state;
                            const statusDesc = ev.status.type.detail;
                            const periodNum = ev.status.period || 1;
                            const isLive = statusType === 'in';
                            const isFinal = statusType === 'post';
                            const isPregame = statusType === 'pre';

                            const awayTeam = comp.competitors.find(c => c.homeAway === 'away');
                            const homeTeam = comp.competitors.find(c => c.homeAway === 'home');

                            if (awayTeam && homeTeam) {
                                let statusClass = 'status-pregame';
                                if (isLive) statusClass = 'status-live';
                                if (isFinal) statusClass = 'status-final';

                                let weatherStr = "";
                                if (ev.weather && ev.weather.temperature) {
                                    weatherStr = `${ev.weather.temperature}°F • ${ev.weather.conditionDisplay || ''}`;
                                } else if (comp.venue && comp.venue.name) {
                                    weatherStr = comp.venue.name;
                                }

                                const awayTeamName = awayTeam.team ? (awayTeam.team.displayName || awayTeam.team.abbreviation) : (awayTeam.athlete ? awayTeam.athlete.displayName : "");
                                const homeTeamName = homeTeam.team ? (homeTeam.team.displayName || homeTeam.team.abbreviation) : (homeTeam.athlete ? homeTeam.athlete.displayName : "");

                                const awayScore = parseInt(awayTeam.score || '0', 10);
                                const homeScore = parseInt(homeTeam.score || '0', 10);

                                const awayLogoUrl = awayTeam.team?.logo || awayTeam.athlete?.headshot || '';
                                const homeLogoUrl = homeTeam.team?.logo || homeTeam.athlete?.headshot || '';

                                let awayPrimaryColor = awayTeam.team?.color ? `#${awayTeam.team.color}` : '#00f0ff';
                                let awayAlternateColor = awayTeam.team?.alternateColor ? `#${awayTeam.team.alternateColor}` : '#00a0cc';

                                let homePrimaryColor = homeTeam.team?.color ? `#${homeTeam.team.color}` : '#ff0055';
                                let homeAlternateColor = homeTeam.team?.alternateColor ? `#${homeTeam.team.alternateColor}` : '#ffea00';

                                let neonColor1 = homePrimaryColor;
                                let neonColor2 = homeAlternateColor;

                                if (!isPregame) {
                                    if (awayScore > homeScore) {
                                        neonColor1 = awayPrimaryColor;
                                        neonColor2 = awayAlternateColor;
                                    } else {
                                        neonColor1 = homePrimaryColor;
                                        neonColor2 = homeAlternateColor;
                                    }
                                } else {
                                    neonColor1 = homePrimaryColor;
                                    neonColor2 = homeAlternateColor;
                                }

                                const summary = (isLive || isFinal) ? await fetchDetailedSummary(ev.id, ep.league) : null;
                                
                                let awaySeasonData = { stats: {}, gamesPlayed: 1 };
                                let homeSeasonData = { stats: {}, gamesPlayed: 1 };
                                if (awayTeam.team?.id && homeTeam.team?.id) {
                                    [awaySeasonData, homeSeasonData] = await Promise.all([
                                        fetchTeamSeasonAverages(awayTeam.team.id, ep.league),
                                        fetchTeamSeasonAverages(homeTeam.team.id, ep.league)
                                    ]);
                                }

                                const awayPlayer = extractKeyPlayer(summary, awayTeam, awayTeamName, awayLogoUrl, ep.cdnSport, ep.league);
                                const homePlayer = extractKeyPlayer(summary, homeTeam, homeTeamName, homeLogoUrl, ep.cdnSport, ep.league);

                                let mlbLineups = null;
                                if (ep.league === 'mlb' && isFinal && summary) {
                                    mlbLineups = await extractMlbBattingLineups(summary, awayTeam.team?.id, homeTeam.team?.id);
                                }

                                let linescores = null;
                                if (awayTeam.linescores && homeTeam.linescores) {
                                    linescores = {
                                        periods: awayTeam.linescores.map((_, idx) => idx + 1),
                                        awayLines: awayTeam.linescores.map(l => l.value),
                                        homeLines: homeTeam.linescores.map(l => l.value)
                                    };
                                }

                                let winProb = { away: 50, home: 50 };
                                if (summary && summary.winprobability && summary.winprobability.length > 0) {
                                    const latestWP = summary.winprobability[summary.winprobability.length - 1];
                                    const homeWP = Math.round((latestWP.homeWinPercentage || 0.5) * 100);
                                    winProb.home = Math.max(5, Math.min(95, homeWP));
                                    winProb.away = 100 - winProb.home;
                                } else if (isLive) {
                                    const scoreDiff = awayScore - homeScore;
                                    let baseAway = 50 + (scoreDiff * 6);
                                    winProb.away = Math.max(10, Math.min(90, baseAway));
                                    winProb.home = 100 - winProb.away;
                                } else if (isFinal) {
                                    if (awayScore > homeScore) { winProb = { away: 100, home: 0 }; }
                                    else if (homeScore > awayScore) { winProb = { away: 0, home: 100 }; }
                                }

                                let nflSituation = null;
                                let isRedzone = false;
                                if (ep.league === 'nfl' && isLive) {
                                    const sit = comp.situation || (summary && summary.situation);
                                    if (sit) {
                                        const downText = sit.down ? (sit.down === 1 ? '1ST' : (sit.down === 2 ? '2ND' : (sit.down === 3 ? '3RD' : '4TH'))) : '';
                                        const dist = sit.distance || 10;
                                        const yard = sit.yardLine || 50;
                                        const poss = sit.possession ? (String(sit.possession) === String(awayTeam.team.id) ? awayTeam.team.abbreviation : homeTeam.team.abbreviation) : '';
                                        
                                        let rawYard = sit.yardLine !== undefined ? sit.yardLine : 50;
                                        let ballPct = 10 + (rawYard * 0.8);
                                        ballPct = Math.max(12, Math.min(88, ballPct));

                                        if (rawYard <= 20 || sit.isRedZone) {
                                            isRedzone = true;
                                        }

                                        let firstDownYard = Math.min(100, rawYard + dist);
                                        let firstDownPct = 10 + (firstDownYard * 0.8);
                                        firstDownPct = Math.max(12, Math.min(88, firstDownPct));

                                        nflSituation = {
                                            text: sit.downDistanceText || `${downText} & ${dist} AT ${poss} ${yard}`,
                                            ballPct: ballPct,
                                            firstDownPct: firstDownPct,
                                            period: periodNum
                                        };
                                    }
                                }

                                let mlbSituation = null;
                                if (ep.league === 'mlb' && isLive) {
                                    const sit = comp.situation || (summary && summary.situation);
                                    mlbSituation = {
                                        onFirst: sit ? !!sit.onFirst : false,
                                        onSecond: sit ? !!sit.onSecond : false,
                                        onThird: sit ? !!sit.onThird : false,
                                        balls: sit && sit.balls !== undefined ? sit.balls : 0,
                                        strikes: sit && sit.strikes !== undefined ? sit.strikes : 0,
                                        outs: sit && sit.outs !== undefined ? sit.outs : 0,
                                        text: statusDesc.toUpperCase()
                                    };
                                }

                                let basketballSituation = null;
                                if ((ep.league === 'nba' || ep.league === 'wnba') && isLive) {
                                    const sit = comp.situation || (summary && summary.situation);
                                    let possTeam = awayTeam.team?.abbreviation || awayTeamName;
                                    if (sit && sit.possession && String(sit.possession) === String(homeTeam.team?.id)) {
                                        possTeam = homeTeam.team?.abbreviation || homeTeamName;
                                    }
                                    basketballSituation = {
                                        possessionText: `🏀 ${possTeam} POSSESSION`,
                                        foulsText: sit?.teamFouls !== undefined ? `TEAM FOULS: ${sit.teamFouls}` : "",
                                        title: statusDesc.toUpperCase()
                                    };
                                }

                                let hockeySituation = null;
                                if (ep.league === 'nhl' && isLive) {
                                    const sit = comp.situation || (summary && summary.situation);
                                    let ppText = "";
                                    if (sit && sit.powerPlay) {
                                        ppText = `⚡ ${sit.powerPlayTeam || 'POWER'} POWER PLAY`;
                                    }
                                    
                                    let awaySog = '0';
                                    let homeSog = '0';
                                    if (awayTeam.statistics) {
                                        const sogObj = awayTeam.statistics.find(s => s.name === 'shotsOnGoal' || s.abbreviation === 'SOG' || s.name === 'shots');
                                        if (sogObj) awaySog = sogObj.displayValue || sogObj.value || '0';
                                    }
                                    if (homeTeam.statistics) {
                                        const sogObj = homeTeam.statistics.find(s => s.name === 'shotsOnGoal' || s.abbreviation === 'SOG' || s.name === 'shots');
                                        if (sogObj) homeSog = sogObj.displayValue || sogObj.value || '0';
                                    }
                                    if (summary && summary.boxscore && summary.boxscore.teams) {
                                        const awayBox = summary.boxscore.teams.find(t => t.team && String(t.team.id) === String(awayTeam.team?.id));
                                        const homeBox = summary.boxscore.teams.find(t => t.team && String(t.team.id) === String(homeTeam.team?.id));
                                        if (awayBox && awayBox.statistics) {
                                            const s = awayBox.statistics.find(st => (st.name || st.label || '').toLowerCase().includes('shots') || (st.name || '').toLowerCase() === 'shotsongoal');
                                            if (s) awaySog = s.displayValue || s.value || awaySog;
                                        }
                                        if (homeBox && homeBox.statistics) {
                                            const s = homeBox.statistics.find(st => (st.name || st.label || '').toLowerCase().includes('shots') || (st.name || '').toLowerCase() === 'shotsongoal');
                                            if (s) homeSog = s.displayValue || s.value || homeSog;
                                        }
                                    }

                                    hockeySituation = {
                                        powerPlayText: ppText,
                                        sogText: `SOG: ${awayTeam.team?.abbreviation || awayTeamName} ${awaySog} - ${homeTeam.team?.abbreviation || homeTeamName} ${homeSog}`,
                                        title: statusDesc.toUpperCase()
                                    };
                                }

                                let combatSituation = null;
                                if ((ep.league === 'ufc' || ep.league === 'boxing') && isLive) {
                                    combatSituation = {
                                        title: statusDesc.toUpperCase(),
                                        awayName: awayTeamName,
                                        homeName: homeTeamName,
                                        awayVal: `${awayScore * 12 + 15} Landed`,
                                        homeVal: `${homeScore * 12 + 12} Landed`,
                                        awayPct: 52,
                                        homePct: 48,
                                        sub: ep.league === 'ufc' ? "UFC Championship Bout" : "12-Round Title Bout"
                                    };
                                }

                                let spread = "";
                                let total = "";
                                let ml = "";
                                if (!isFinal && comp.odds && comp.odds.length > 0) {
                                    const o = comp.odds[0];
                                    spread = o.details || "";
                                    total = o.overUnder ? `${o.overUnder}` : "";
                                    ml = (o.awayTeamOdds && o.homeTeamOdds) ? `${o.awayTeamOdds.moneyLine || ''} / ${o.homeTeamOdds.moneyLine || ''}` : "";
                                }

                                const dateBadgeLabel = isYesterday ? "YESTERDAY" : "TODAY";
                                const gameTimeCST = formatTimeToCST(ev.date);

                                let hasMomentum = false;
                                let momentumText = "";
                                if (isLive) {
                                    const scoreDiff = Math.abs(awayScore - homeScore);
                                    if (scoreDiff <= 4 && (awayScore > 10 || homeScore > 10)) {
                                        hasMomentum = true;
                                        momentumText = "⚡ TIGHT BATTLE";
                                    } else if (scoreDiff >= 8 && scoreDiff <= 15) {
                                        hasMomentum = true;
                                        momentumText = awayScore > homeScore ? `🔥 ${awayTeamName} RUN` : `🔥 ${homeTeamName} RUN`;
                                    }
                                }

                                let livePlayoffContext = "";
                                if (comp.notes && comp.notes.length > 0 && comp.notes[0].headline) {
                                    livePlayoffContext = comp.notes[0].headline.toUpperCase();
                                } else if (ep.league === 'ufc' || ep.league === 'boxing') {
                                    livePlayoffContext = "CHAMPIONSHIP BOUT";
                                } else if (ev.season && ev.season.type === 3) {
                                    livePlayoffContext = "POSTSEASON / PLAYOFFS";
                                } else {
                                    const seasonTypeDesc = ev.season?.typeName || "";
                                    if (seasonTypeDesc.toUpperCase().includes("PLAYOFF") || seasonTypeDesc.toUpperCase().includes("FINAL")) {
                                        livePlayoffContext = seasonTypeDesc.toUpperCase();
                                    }
                                }

                                const resolvedTapeMetrics = await extractFullyPopulatedTapeMetrics(summary, awayTeam.team?.id, homeTeam.team?.id, ep.league, winProb, awayScore, homeScore, isPregame, isFinal, awaySeasonData, homeSeasonData);

                                fetchedGames.push({
                                    league: `${ep.label} • ${dateBadgeLabel}`,
                                    isLive: isLive,
                                    isFinal: isFinal,
                                    isPregame: isPregame,
                                    isNba: ep.league === 'nba' || ep.league === 'wnba',
                                    isNhl: ep.league === 'nhl',
                                    isNfl: ep.league === 'nfl',
                                    isMlb: ep.league === 'mlb',
                                    isCombat: ep.league === 'ufc' || ep.league === 'boxing',
                                    isRedzone: isRedzone,
                                    hasMomentum: hasMomentum,
                                    momentumText: momentumText,
                                    playoffContext: livePlayoffContext,
                                    primaryColor: neonColor1,
                                    winningColor1: neonColor1,
                                    winningColor2: neonColor2,
                                    status: statusDesc.toUpperCase(),
                                    statusClass: statusClass,
                                    network: (comp.broadcasts && comp.broadcasts[0] && comp.broadcasts[0].names[0]) ? comp.broadcasts[0].names[0] : '',
                                    weather: weatherStr,
                                    odds: { spread, total, ml },
                                    nflSituation: nflSituation,
                                    mlbSituation: mlbSituation,
                                    basketballSituation: basketballSituation,
                                    hockeySituation: hockeySituation,
                                    combatSituation: combatSituation,
                                    linescores: linescores,
                                    winProb: winProb,
                                    tapeMetrics: resolvedTapeMetrics,
                                    mlbLineups: mlbLineups,
                                    away: {
                                        name: awayTeamName,
                                        record: (awayTeam.records && awayTeam.records[0]) ? awayTeam.records[0].summary : '',
                                        score: awayScore,
                                        logo: awayLogoUrl
                                    },
                                    home: {
                                        name: homeTeamName,
                                        record: (homeTeam.records && homeTeam.records[0]) ? homeTeam.records[0].summary : '',
                                        score: homeScore,
                                        logo: homeLogoUrl
                                    },
                                    timeCenter: isLive ? statusDesc : (isFinal ? 'FINAL' : gameTimeCST),
                                    players: { away: awayPlayer, home: homePlayer }
                                });

                                tickerItemsList.push(`<span class='league-tag'>${ep.label} (${dateBadgeLabel})</span> <img src='${awayLogoUrl}' class='ticker-logo' onerror='this.style.display="none"'> ${awayTeamName} <span style="color:#ffea00; font-weight:700;">${awayScore}</span> - <img src='${homeLogoUrl}' class='ticker-logo' onerror='this.style.display="none"'> ${homeTeamName} <span style="color:#ffea00; font-weight:700;">${homeScore}</span> [${statusDesc}]`);
                            }
                        }
                    }
                } catch (err) {
                    console.error("Error fetching live data endpoint:", err);
                }
            }
        }

        async function fetchLiveScores() {
            let fetchedGames = [];
            let tickerItemsList = [];
            const headlines = await fetchNewsAndHeadlines();
            headlines.forEach(hl => tickerItemsList.push(hl));

            await processGamesForDate(getFormattedDate(0), false, fetchedGames, tickerItemsList);
            await processGamesForDate(getFormattedDate(-1), true, fetchedGames, tickerItemsList);

            if (fetchedGames.length > 0) {
                liveMatchups = fetchedGames;
                tickerNews = tickerItemsList;
                initTicker();
            }
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('liveClock').textContent = now.toLocaleTimeString('en-US', {
                timeZone: 'America/Chicago',
                hour: 'numeric',
                minute: '2-digit',
                hour12: true
            });
        }

        function toggleRotation(e) {
            e.stopPropagation();
            document.getElementById('bodyEl').classList.toggle('rotated-90');
        }

        function initTicker() {
            const container = document.getElementById('tickerContent');
            if (tickerNews.length === 0) return;
            let html = '';
            for (let i = 0; i < 3; i++) {
                tickerNews.forEach(item => {
                    html += `<div class="ticker-item">${item}<span class="divider">///</span></div>`;
                });
            }
            container.innerHTML = html;
            if (tickerAnimId) cancelAnimationFrame(tickerAnimId);
            startTickerLoop();
        }

        function startTickerLoop() {
            const container = document.getElementById('tickerContent');
            if (!container) return;
            function step() {
                tickerX -= tickerSpeed;
                const halfWidth = container.scrollWidth / 3;
                if (halfWidth > 0 && Math.abs(tickerX) >= halfWidth) {
                    tickerX += halfWidth;
                }
                container.style.transform = `translate3d(${tickerX}px, 0, 0)`;
                tickerAnimId = requestAnimationFrame(step);
            }
            if (tickerAnimId) cancelAnimationFrame(tickerAnimId);
            tickerAnimId = requestAnimationFrame(step);
        }

        function renderMatchup(index) {
            if (!liveMatchups || liveMatchups.length === 0) return;
            const data = liveMatchups[index % liveMatchups.length];
            const card = document.getElementById('matchupCard');
            const tapeCard = document.getElementById('tapeCard');
            const spotlight = document.getElementById('spotlightCard');
            const redzoneBanner = document.getElementById('redzoneAlertBanner');

            card.classList.add('fade-out');
            tapeCard.classList.add('fade-out');
            spotlight.classList.add('fade-out');

            setTimeout(() => {
                const root = document.documentElement;
                root.style.setProperty('--team-primary', data.primaryColor);
                root.style.setProperty('--winning-color-1', data.winningColor1);
                root.style.setProperty('--winning-color-2', data.winningColor2);
                root.style.setProperty('--stadium-glow', `${data.winningColor1}35`);

                document.getElementById('gameStatus').textContent = data.status;
                document.getElementById('gameStatus').className = `game-status ${data.statusClass}`;
                
                const momentumBadge = document.getElementById('momentumBadge');
                if (data.hasMomentum) {
                    momentumBadge.textContent = data.momentumText;
                    momentumBadge.classList.add('active');
                } else {
                    momentumBadge.classList.remove('active');
                }

                const playoffBadge = document.getElementById('playoffBadge');
                if (data.playoffContext) {
                    playoffBadge.textContent = data.playoffContext;
                    playoffBadge.style.display = 'inline-block';
                } else {
                    playoffBadge.style.display = 'none';
                }

                document.getElementById('networkInfo').textContent = data.network;
                
                const weatherBadge = document.getElementById('weatherBadge');
                if (data.weather) {
                    weatherBadge.textContent = data.weather;
                    weatherBadge.style.display = 'inline-block';
                } else {
                    weatherBadge.style.display = 'none';
                }

                document.getElementById('tapeMatchupSub').textContent = `${data.away.name} vs ${data.home.name}`;
                
                const tapeGrid = document.getElementById('tapeMetricsGrid');
                
                if (data.isMlb && data.isFinal && data.mlbLineups && (data.mlbLineups.awayBatters.length > 0 || data.mlbLineups.homeBatters.length > 0)) {
                    document.getElementById('tapeHeaderTitle').textContent = "⚾ BATTING LINEUPS & STATS";
                    
                    function renderTeamBattingTable(teamName, batters) {
                        if (!batters || batters.length === 0) return '';
                        return `
                            <div class="mlb-lineup-section-title">${teamName} Batting</div>
                            <table class="mlb-lineup-table">
                                <thead>
                                    <tr><th>Pos</th><th>Batter</th><th>AB</th><th>R</th><th>H</th><th>RBI</th><th>BB</th><th>SO</th><th>HR</th></tr>
                                </thead>
                                <tbody>
                                    ${batters.map(b => `
                                        <tr>
                                            <td>${b.pos}</td>
                                            <td>${b.name}</td>
                                            <td>${b.ab}</td>
                                            <td>${b.r}</td>
                                            <td>${b.h}</td>
                                            <td>${b.rbi}</td>
                                            <td>${b.bb}</td>
                                            <td>${b.so}</td>
                                            <td>${b.hr}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        `;
                    }

                    tapeGrid.innerHTML = `
                        <div class="mlb-lineup-container">
                            ${renderTeamBattingTable(data.away.name, data.mlbLineups.awayBatters)}
                            ${renderTeamBattingTable(data.home.name, data.mlbLineups.homeBatters)}
                        </div>
                    `;
                } else {
                    document.getElementById('tapeHeaderTitle').textContent = "⚡ Tale of the Tape & Comparison";
                    tapeGrid.innerHTML = data.tapeMetrics.map(m => `
                        <div class="tape-metric-row">
                            <span class="tape-metric-label">${m.label}</span>
                            <span class="tape-metric-val-away">${m.awayVal}</span>
                            <div class="tape-bar-container">
                                <div class="tape-bar-fill-away" style="width: ${m.awayPct}%;"></div>
                                <div class="tape-bar-fill-home" style="width: ${m.homePct}%;"></div>
                            </div>
                            <span class="tape-metric-val-home">${m.homeVal}</span>
                        </div>
                    `).join('');
                }

                document.getElementById('awayLogo').src = data.away.logo;
                document.getElementById('awayName').textContent = data.away.name;
                document.getElementById('awayRecord').textContent = data.away.record;
                document.getElementById('awayScore').textContent = data.away.score;

                document.getElementById('homeLogo').src = data.home.logo;
                document.getElementById('homeName').textContent = data.home.name;
                document.getElementById('homeRecord').textContent = data.home.record;
                document.getElementById('homeScore').textContent = data.home.score;

                document.getElementById('gameTimeCenter').textContent = data.timeCenter;

                const lineContainer = document.getElementById('lineScoreContainer');
                const lineHeaderRow = document.getElementById('lineScoreHeaderRow');
                const lineBody = document.getElementById('lineScoreBody');

                if (data.linescores && data.linescores.periods.length > 0) {
                    lineContainer.style.display = 'block';
                    lineHeaderRow.innerHTML = `<th>Team</th>` + data.linescores.periods.map(p => `<th>${p}</th>`).join('') + `<th>T</th>`;
                    lineBody.innerHTML = `
                        <tr>
                            <td>${data.away.name}</td>
                            ${data.linescores.awayLines.map(v => `<td>${v}</td>`).join('')}
                            <td><strong>${data.away.score}</strong></td>
                        </tr>
                        <tr>
                            <td>${data.home.name}</td>
                            ${data.linescores.homeLines.map(v => `<td>${v}</td>`).join('')}
                            <td><strong>${data.home.score}</strong></td>
                        </tr>
                    `;
                } else {
                    lineContainer.style.display = 'none';
                }

                const winProbWrapper = document.getElementById('winProbWrapper');
                if (data.winProb && !data.isFinal) {
                    winProbWrapper.style.display = 'flex';
                    document.getElementById('winProbAwayLabel').textContent = `${data.away.name} ${data.winProb.away}%`;
                    document.getElementById('winProbHomeLabel').textContent = `${data.home.name} ${data.winProb.home}%`;
                    document.getElementById('winProbAwayFill').style.width = `${data.winProb.away}%`;
                    document.getElementById('winProbHomeFill').style.width = `${data.winProb.home}%`;
                } else {
                    winProbWrapper.style.display = 'none';
                }

                if (data.isNfl && data.isRedzone && data.isLive) {
                    document.getElementById('redzoneMatchupText').textContent = `${data.away.name} VS ${data.home.name}`;
                    document.getElementById('redzoneSituationText').textContent = data.nflSituation ? data.nflSituation.text : "INSIDE THE 20";
                    redzoneBanner.classList.add('active');
                    playRedzoneAudioAlert();
                    setTimeout(() => redzoneBanner.classList.remove('active'), 4000);
                } else {
                    redzoneBanner.classList.remove('active');
                }

                const nflField = document.getElementById('nflFieldContainer');
                const mlbDiamond = document.getElementById('mlbDiamondContainer');
                const bbCourt = document.getElementById('basketballCourtContainer');
                const nhlRink = document.getElementById('hockeyRinkContainer');
                const combatStats = document.getElementById('combatStatsContainer');

                nflField.style.display = 'none';
                mlbDiamond.style.display = 'none';
                bbCourt.style.display = 'none';
                nhlRink.style.display = 'none';
                combatStats.style.display = 'none';

                if (data.isLive) {
                    if (data.isNfl) {
                        nflField.style.display = 'flex';
                        const currentQuarter = data.nflSituation?.period || 1;
                        const isEvenQuarter = currentQuarter % 2 === 0;
                        const leftLogo = isEvenQuarter ? data.home.logo : data.away.logo;
                        const rightLogo = isEvenQuarter ? data.away.logo : data.home.logo;

                        document.getElementById('nflLeftLogoImg').src = leftLogo;
                        document.getElementById('nflRightLogoImg').src = rightLogo;

                        if (data.nflSituation) {
                            document.getElementById('nflSituationText').textContent = data.nflSituation.text;
                            document.getElementById('nflBallMarker').style.left = `${data.nflSituation.ballPct}%`;
                            document.getElementById('nflFirstDownLine').style.left = `${data.nflSituation.firstDownPct}%`;
                        }
                    } else if (data.isMlb) {
                        mlbDiamond.style.display = 'flex';
                        if (data.mlbSituation) {
                            document.getElementById('mlbSituationText').textContent = data.mlbSituation.text;
                            document.getElementById('base1st').className = `base-indicator base-1st ${data.mlbSituation.onFirst ? 'active' : ''}`;
                            document.getElementById('base2nd').className = `base-indicator base-2nd ${data.mlbSituation.onSecond ? 'active' : ''}`;
                            document.getElementById('base3rd').className = `base-indicator base-3rd ${data.mlbSituation.onThird ? 'active' : ''}`;
                            
                            document.getElementById('ball1').className = `count-dot ${data.mlbSituation.balls >= 1 ? 'ball-on' : ''}`;
                            document.getElementById('ball2').className = `count-dot ${data.mlbSituation.balls >= 2 ? 'ball-on' : ''}`;
                            document.getElementById('ball3').className, `count-dot ${data.mlbSituation.balls >= 3 ? 'ball-on' : ''}`;

                            document.getElementById('strike1').className = `count-dot ${data.mlbSituation.strikes >= 1 ? 'strike-on' : ''}`;
                            document.getElementById('strike2').className = `count-dot ${data.mlbSituation.strikes >= 2 ? 'strike-on' : ''}`;

                            document.getElementById('out1').className = `count-dot ${data.mlbSituation.outs >= 1 ? 'out-on' : ''}`;
                            document.getElementById('out2').className = `count-dot ${data.mlbSituation.outs >= 2 ? 'out-on' : ''}`;

                            document.getElementById('mlbCountText').textContent = `${data.mlbSituation.balls}-${data.mlbSituation.strikes}, ${data.mlbSituation.outs} Out`;
                        }
                    } else if (data.isNba) {
                        bbCourt.style.display = 'flex';
                        if (data.basketballSituation) {
                            document.getElementById('bbCourtTitle').textContent = data.basketballSituation.title;
                            document.getElementById('bbPossessionBadge').textContent = data.basketballSituation.possessionText;
                            document.getElementById('bbFoulsText').textContent = data.basketballSituation.foulsText;
                        }
                    } else if (data.isNhl) {
                        nhlRink.style.display = 'flex';
                        if (data.hockeySituation) {
                            document.getElementById('nhlRinkTitle').textContent = data.hockeySituation.title;
                            document.getElementById('nhlPowerPlayBadge').textContent = data.hockeySituation.powerPlayText;
                            document.getElementById('nhlSogText').textContent = data.hockeySituation.sogText;
                        }
                    } else if (data.isCombat) {
                        combatStats.style.display = 'flex';
                        if (data.combatSituation) {
                            document.getElementById('combatTitleText').textContent = data.combatSituation.title;
                            document.getElementById('combatAwayName').textContent = data.combatSituation.combatAwayName || data.combatSituation.awayName;
                            document.getElementById('combatHomeName').textContent = data.combatSituation.combatHomeName || data.combatSituation.homeName;
                            document.getElementById('combatAwayVal').textContent = data.combatSituation.combatAwayVal || data.combatSituation.awayName;
                            document.getElementById('combatHomeVal').textContent = data.combatSituation.combatHomeVal || data.combatSituation.homeName;
                            document.getElementById('combatCenterSub').textContent = data.combatSituation.sub;
                        }
                    }
                }

                const oddsBar = document.getElementById('oddsBar');
                if (data.odds.spread || data.odds.total) {
                    oddsBar.style.display = 'flex';
                    document.getElementById('oddsSpread').textContent = data.odds.spread || '—';
                    document.getElementById('oddsTotal').textContent = data.odds.total || '—';
                    document.getElementById('oddsML').textContent = data.odds.ml || '—';
                } else {
                    oddsBar.style.display = 'none';
                }

                document.getElementById('spotlightHeaderText').textContent = data.isNba ? "TOP SCORER" : (data.isNhl ? "TOP SCORER" : "KEY PLAYER MATCHUP");
                
                const awayImg = document.getElementById('awayPlayerImg');
                if (data.players.away.img) {
                    awayImg.src = data.players.away.img;
                } else {
                    awayImg.style.display = 'none';
                }
                document.getElementById('awayPlayerName').textContent = data.players.away.name;
                document.getElementById('awayPlayerPos').textContent = data.players.away.pos;
                document.getElementById('awayPlayerStat').textContent = data.players.away.stat;

                const homeImg = document.getElementById('homePlayerImg');
                if (data.players.home.img) {
                    homeImg.src = data.players.home.img;
                } else {
                    homeImg.style.display = 'none';
                }
                document.getElementById('homePlayerName').textContent = data.players.home.name;
                document.getElementById('homePlayerPos').textContent = data.players.home.pos;
                document.getElementById('homePlayerStat').textContent = data.players.home.stat;

                card.classList.remove('fade-out');
                tapeCard.classList.remove('fade-out');
                spotlight.classList.remove('fade-out');
            }, 400);
        }

        function startRotator() {
            const progressBar = document.getElementById('rotatorProgress');
            let elapsed = 0;
            const intervalStep = 50;
            setInterval(() => {
                if (liveMatchups.length === 0) return;
                elapsed += intervalStep;
                progressBar.style.width = `${(elapsed / ROTATE_INTERVAL_MS) * 100}%`;
                if (elapsed >= ROTATE_INTERVAL_MS) {
                    elapsed = 0;
                    currentMatchupIndex = (currentMatchupIndex + 1) % liveMatchups.length;
                    renderMatchup(currentMatchupIndex);
                }
            }, intervalStep);
        }

        window.addEventListener('DOMContentLoaded', async () => {
            updateClock();
            setInterval(updateClock, 1000);
            await fetchLiveScores();
            setInterval(fetchLiveScores, 60000);
            if (liveMatchups.length > 0) renderMatchup(0);
            startRotator();
        });
    </script>
</body>
</html>
